<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Agent Helper</title><desc id="desc">Close the lid. Keep the thought. A local bridge from folder to tmux to Amphetamine.</desc>
  <rect width="1200" height="520" fill="#12130F"/><rect x="1" y="1" width="1198" height="518" fill="none" stroke="#E9E6DC" stroke-width="2"/><path d="M0 68H1200M875 68V430M0 430H1200" stroke="#E9E6DC" stroke-width="2"/>
  <g transform="translate(34 19)"><path d="M5 25V5h44v20" fill="none" stroke="#E9E6DC" stroke-width="3"/><path d="M0 26h54l-6 9H7z" fill="#FF6845"/><path d="M27 1v20" stroke="#FF6845" stroke-width="3"/><text x="70" y="25" fill="#E9E6DC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" letter-spacing="2.4">AGENT HELPER</text></g>
  <text x="1145" y="42" text-anchor="end" fill="#88877F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.7">MACOS · LOCAL ONLY</text><text x="44" y="116" fill="#FF6845" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="2.3">PROCESS CONTINUITY / UTILITY 001</text>
  <text x="40" y="226" fill="#E9E6DC" font-family="Georgia, 'Times New Roman', serif" font-size="88" letter-spacing="-4">Close the lid.</text><text x="40" y="315" fill="#799BFF" font-family="Georgia, 'Times New Roman', serif" font-size="88" font-style="italic" letter-spacing="-4">Keep the thought.</text><text x="44" y="378" fill="#AAA89F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">One folder. One persistent shell. The same process when you return.</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace"><path d="M875 188H920" stroke="#E9E6DC" stroke-width="2"/><circle cx="875" cy="188" r="7" fill="#FF6845"/><text x="942" y="171" fill="#88877F" font-size="10" letter-spacing="1.5">INPUT</text><text x="942" y="202" fill="#E9E6DC" font-family="Georgia, serif" font-size="30">folder</text><path d="M875 285H920" stroke="#E9E6DC" stroke-width="2"/><circle cx="875" cy="285" r="7" fill="#799BFF"/><text x="942" y="268" fill="#88877F" font-size="10" letter-spacing="1.5">RELAY</text><text x="942" y="299" fill="#E9E6DC" font-family="Georgia, serif" font-size="30">tmux</text><path d="M875 382H920" stroke="#E9E6DC" stroke-width="2"/><circle cx="875" cy="382" r="7" fill="#B9C8AD"/><text x="942" y="365" fill="#88877F" font-size="10" letter-spacing="1.5">POWER</text><text x="942" y="396" fill="#E9E6DC" font-family="Georgia, serif" font-size="30">awake</text></g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11"><rect y="430" width="300" height="90" fill="#12130F"/><rect x="300" y="430" width="300" height="90" fill="#12130F"/><rect x="600" y="430" width="300" height="90" fill="#799BFF"/><rect x="900" y="430" width="300" height="90" fill="#12130F"/><path d="M300 430V520M600 430V520M900 430V520" stroke="#E9E6DC" stroke-width="2"/><text x="24" y="463" fill="#FF6845">01 / ENTER</text><text x="24" y="493" fill="#E9E6DC" font-size="15">$ agent</text><text x="324" y="463" fill="#799BFF">02 / WORK</text><text x="324" y="493" fill="#E9E6DC" font-size="14">$ codex / claude</text><text x="624" y="463" fill="#12130F">03 / DETACH</text><text x="624" y="493" fill="#12130F" font-size="15">Ctrl-B D</text><text x="924" y="463" fill="#FF6845">04 / RETURN</text><text x="924" y="493" fill="#E9E6DC" font-size="15">$ agent</text></g>
</svg>
